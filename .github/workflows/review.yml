{
  "name": "Review Nixpkgs pull request",
  "run-name": "Review Nixpkgs PR #${{ inputs.pr }} (${{ inputs.platform-scope }})",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "pr": {
          "description": "Open NixOS/nixpkgs PR number from your fork",
          "type": "string",
          "required": true
        },
        "attribute": {
          "description": "Package attribute to inspect for supported platforms",
          "type": "string",
          "required": true
        },
        "platform-scope": {
          "description": "auto permits all eligible systems; darwin only permits Darwin",
          "type": "choice",
          "options": [
            "auto",
            "darwin"
          ],
          "default": "auto"
        },
        "force": {
          "description": "Create a new attempt for known state; never bypass unresolved dispatches",
          "type": "boolean",
          "default": false
        }
      }
    },
    "workflow_call": {
      "inputs": {
        "pr": {
          "description": "Open NixOS/nixpkgs PR number from your fork",
          "type": "string",
          "required": true
        },
        "attribute": {
          "description": "Package attribute to inspect for supported platforms",
          "type": "string",
          "required": true
        },
        "platform-scope": {
          "description": "auto permits all eligible systems; darwin only permits Darwin",
          "type": "string",
          "default": "auto"
        },
        "force": {
          "description": "Create a new attempt for known state; never bypass unresolved dispatches",
          "type": "boolean",
          "default": false
        },
        "expected-head": {
          "description": "Internal submission guard against a changed PR head",
          "type": "string",
          "default": "",
          "required": false
        }
      },
      "secrets": {
        "NIXPKGS_REVIEW_GHA_TOKEN": {
          "required": false
        }
      }
    }
  },
  "permissions": {},
  "env": {
    "COORDINATION_REPOSITORY": "${{ vars.NIXPKGS_CONTRIBUTION_REPOSITORY || format('{0}/nixpkgs-contribution-workflows', github.repository_owner) }}",
    "NIXPKGS_FORK_REPOSITORY": "${{ vars.NIXPKGS_FORK_REPOSITORY }}",
    "NIXPKGS_REVIEW_GHA_REPOSITORY": "${{ vars.NIXPKGS_REVIEW_GHA_REPOSITORY }}",
    "GITHUB_WORKFLOW_SHA": "${{ github.workflow_sha }}",
    "INPUT_JSON": "${{ toJSON(inputs) }}"
  },
  "jobs": {
    "evaluate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24",
          "with": {
            "extra_nix_config": "allow-import-from-derivation = false"
          }
        },
        {
          "name": "review-evaluate --snapshot review.json",
          "run": "python3 -m contribution.cli review-evaluate --snapshot review.json",
          "env": {
            "GITHUB_READ_TOKEN": "${{ github.token }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "review-${{ github.run_id }}",
            "path": "review.json",
            "if-no-files-found": "error",
            "retention-days": 7,
            "overwrite": true
          }
        }
      ]
    },
    "dispatch": {
      "needs": [
        "evaluate"
      ],
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "write"
      },
      "concurrency": {
        "group": "review-NixOS-nixpkgs-${{ inputs.pr }}",
        "cancel-in-progress": false,
        "queue": "max"
      },
      "steps": [
        {
          "uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "review-${{ github.run_id }}"
          }
        },
        {
          "name": "review-dispatch --snapshot review.json",
          "run": "python3 -m contribution.cli review-dispatch --snapshot review.json",
          "env": {
            "GITHUB_READ_TOKEN": "${{ github.token }}",
            "LEDGER_TOKEN": "${{ github.token }}",
            "NIXPKGS_REVIEW_GHA_TOKEN": "${{ secrets.NIXPKGS_REVIEW_GHA_TOKEN }}"
          }
        }
      ]
    }
  }
}
