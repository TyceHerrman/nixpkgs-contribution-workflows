{
  "name": "Test",
  "on": {
    "push": {
      "branches-ignore": [
        "state/reviews"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "test": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10",
          "with": {
            "persist-credentials": false,
            "repository": "NixOS/nixpkgs",
            "ref": "18336200ae40e1397a5e24ad2ecd24991ec60d67",
            "path": "fixture-lib",
            "sparse-checkout": "lib"
          }
        },
        {
          "uses": "cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24",
          "with": {
            "extra_nix_config": "allow-import-from-derivation = false"
          }
        },
        {
          "name": "Unit, workflow graph and real Nix metadata fixture tests",
          "run": "python3 -m unittest discover -s tests -v",
          "env": {
            "NIXPKGS_LIB": "${{ github.workspace }}/fixture-lib/lib"
          }
        }
      ]
    }
  }
}
